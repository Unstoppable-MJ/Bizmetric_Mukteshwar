name: BTC Forecasting CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Django Tests
      run: |
        cd ML_Dashboard
        python manage.py test

    - name: FastAPI Sanity Check
      run: |
        # Check if uvicorn can load the app without errors
        # We use timeout to avoid waiting too long if it starts successfully
        timeout 5s uvicorn src.api.app:app --host 0.0.0.0 --port 8000 || [ $? -eq 124 ]

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AZURE_HOST }}
        username: ${{ secrets.AZURE_USER }}
        key: ${{ secrets.AZURE_SSH }}
        script: |
          # 1. Navigate to the project directory
          cd /path/to/your/btc_forecasting  # <--- CHANGE THIS to your actual server path

          # 2. Pull the latest code from master
          git pull origin master

          # 3. Update dependencies
          source venv/bin/activate  # <--- Uncomment/adjust if using a virtualenv
          pip install -r requirements.txt

          # 4. Run Django migrations (optional)
          cd ML_Dashboard
          python manage.py migrate
          cd ..

          # 5. Restart Services
          # Examples:
          # sudo systemctl restart gunicorn
          # pm2 restart btc-api
          # nohup uvicorn src.api.app:app --host 0.0.0.0 --port 8000 &
          echo "Deployment successful!"
